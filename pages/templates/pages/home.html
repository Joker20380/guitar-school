<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Школа игры на гитаре</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    .hero {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      text-align: center;
    }

    .hero-inner {
      max-width: 820px;
    }

    .badge {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(245, 158, 11, .16);
      color: #fbbf24;
      font-weight: 600;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(42px, 7vw, 82px);
      line-height: .95;
    }

    p {
      margin: 0 auto 32px;
      max-width: 620px;
      color: #d1d5db;
      font-size: 20px;
      line-height: 1.6;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      border-radius: 999px;
      background: #f59e0b;
      color: #111827;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="hero-inner">
      <div class="badge">Django + Docker запущены</div>
      <h1>Школа игры на гитаре</h1>
      <p>
        Базовая платформа готова: дальше добавим курсы, преподавателей,
        расписание, заявки и страницу настройки гитары.
      </p>
      <a class="button" href="/admin/">Перейти в админку</a>
    </div>
  </main>
</body>
</html>
