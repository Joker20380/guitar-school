<ul class="material-links">
  {% for material in materials %}
    <li>
      <a class="course-inline-link" href="{{ material.resource_url }}"{% if material.external_url %} target="_blank" rel="noopener noreferrer"{% endif %}>
        {{ material.title }}
      </a>
      <span class="material-kind">{% if material.file %}Download file{% else %}Open resource{% endif %}</span>
    </li>
  {% endfor %}
</ul>
